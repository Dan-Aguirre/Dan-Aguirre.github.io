<html lang="en">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.goatcounter.com; connect-src 'self' https://*.goatcounter.com; object-src 'none'; base-uri 'none'; form-action 'none'">

<body class="lost">
<main>
  <p class="kicker"><span class="dot"></span>HTTP 404</p>
  <h1>Out of<br><span>scope.</span></h1>
  <p class="lead-404">There's nothing at <code id="path">this path</code>. If you were enumerating directories, respect, but this host is static and the good stuff is back on the desk.</p>
  <form id="login" class="fake-login" hidden>
    <p class="kicker">admin panel v1.0 (definitely real)</p>
    <label>username <input name="u" autocomplete="off" spellcheck="false"></label>
    <label>password <input name="p" type="password" autocomplete="off"></label>
    <button class="btn primary">log in</button>
    <p id="msg" class="msg" role="status"></p>
  </form>
  <a class="btn" href="/">← back to the desk</a>
</main>
</body>
</html>
