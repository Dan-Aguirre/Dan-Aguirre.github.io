<!--
  Hi, source reader. You're my kind of person.

  No framework here: three.js, some homemade physics, and a lot of rounded boxes.
  Here's something for your trouble:

      REFOe3ZpZXdfc291cmNlX2lzX3JlY29ufQ==

  Decode it and submit it in the terminal (press T). There are 14 more.
-->
<body data-world="desk">
<canvas id="scene" tabindex="-1" aria-label="A small RC car on a desk at night. Use WASD or arrow keys to drive."></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="joy" aria-hidden="true"><i></i></div>

<header class="hud-top">
  <a class="brand" href="./">Daniel Aguirre<small>offsec · consulting · teaching</small></a>
  <nav class="hud-btns" aria-label="controls">
    <button id="flagBtn" class="hb game" title="flags"><b>⚑</b> <span id="flagCount">0/15</span></button>
    <button id="placesBtn" class="hb game" data-t="ui.places">Places</button>
    <button id="termBtn" class="hb game mono" title="terminal (T)">&gt;_</button>
    <button id="soundBtn" class="hb game" title="sound (M)" aria-label="sound"><i>♪</i></button>
    <div class="lang hb-group" role="group" aria-label="language"></div>
    <a id="recruiterLink" class="hb strong" href="cv.html" data-t="ui.recruiter">Recruiter mode</a>
  </nav>
</header>

<div id="places" class="places" hidden><div class="list"></div></div>

<div id="progress" class="game"><span class="where"></span><span class="count"></span><span class="next"></span><b class="bar"></b></div>
<div id="keys" class="game" aria-hidden="true"></div>
<button id="prompt" class="prompt" disabled></button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<aside id="card" class="card" aria-live="polite">
  <button id="cardClose" class="x" aria-label="close">×</button>
  <div class="card-body"></div>
</aside>

<section id="term" class="term" hidden aria-label="terminal">
  <div class="term-bar"><span>dan@desk: ~</span><button id="termClose" class="x" aria-label="close terminal">×</button></div>
  <div class="term-out" aria-live="polite"></div>
  <form class="term-line" autocomplete="off"><label class="ps1" for="termIn">dan@desk:~$</label><input id="termIn" spellcheck="false" autocapitalize="off" autocomplete="off"></form>
</section>

<div id="warp" class="warp" hidden><pre></pre></div>

<section id="intro" class="intro">
  <div class="intro-inner">
    <p class="kicker"><span class="dot"></span><span data-t="ui.kicker"></span></p>
    <h1>Daniel <span>Aguirre</span></h1>
    <p class="tagline" data-t="ui.tagline"></p>
    <p class="blurb" data-t="ui.intro"></p>
    <div class="cta">
      <button id="start" class="btn primary" disabled><span data-t="ui.start">Drive in</span><kbd>↵</kbd></button>
      <a class="btn ghost recruiter" href="cv.html"><span data-t="ui.recruiter">Recruiter mode</span><small data-t="ui.recruiterSub"></small></a>
    </div>
    <p class="loading"><span class="spin"></span><span data-t="ui.loading">loading</span></p>
  </div>
</section>
<noscript><p class="nojs">This page needs JavaScript for the 3D part. The plain version is at <a href="cv.html">cv.html</a>.</p></noscript>
